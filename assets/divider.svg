<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="6" viewBox="0 0 1200 6" aria-hidden="true">
  <defs>
    <linearGradient id="base" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity="0"/><stop offset="0.5" stop-color="#2d3b52"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient>
    <linearGradient id="spark" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity="0"/><stop offset="0.5" stop-color="#38bdf8"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient>
  </defs>
  <style>.s { animation: s 5s cubic-bezier(.45,.05,.55,.95) infinite; } @keyframes s { from { transform: translateX(-240px) } to { transform: translateX(1200px) } }
  @media (prefers-reduced-motion: reduce) { .s { animation: none; opacity: 0 } }</style>
  <rect y="2.5" width="1200" height="1" fill="url(#base)"/>
  <rect class="s" y="2" width="240" height="2" rx="1" fill="url(#spark)"/>
</svg>